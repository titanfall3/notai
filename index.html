<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Web Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e0e12; color: #e2e2e6; display: flex; flex-direction: column; height: 100dvh; }
    header { background: #1a1a24; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2b2b36; }
    .config-row { display: flex; gap: 8px; }
    input, select, button { border-radius: 8px; border: 1px solid #3a3a48; background: #161620; color: #fff; padding: 8px 12px; font-size: 14px; }
    input[type="text"] { flex-grow: 1; }
    button { background: #007acc; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #005999; }
    #chat-box { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #007acc; color: #fff; }
    .ai { align-self: flex-start; background: #22222c; }
    .system { align-self: center; font-size: 12px; color: #888; }
    footer { padding: 12px 16px; background: #161620; display: flex; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="config-row">
      <input type="text" id="tunnel-url" placeholder="Backend URL (e.g. https://xxxx.trycloudflare.com)">
      <button onclick="fetchModels()">Connect</button>
    </div>
    <div class="config-row">
      <select id="model-select" style="flex-grow: 1;">
        <option value="llama3.2">llama3.2</option>
      </select>
    </div>
  </header>

  <div id="chat-box">
    <div class="message system">Enter your backend URL above and click Connect to start.</div>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    let chatHistory = [];

    // Save/load URL locally in browser
    document.getElementById('tunnel-url').value = localStorage.getItem('backend_url') || '';

    function getBaseUrl() {
      let url = document.getElementById('tunnel-url').value.trim();
      if (url.endsWith('/')) url = url.slice(0, -1);
      localStorage.setItem('backend_url', url);
      return url;
    }

    async function fetchModels() {
      const baseUrl = getBaseUrl();
      if (!baseUrl) return alert('Please enter your backend URL.');
      
      try {
        const res = await fetch(`${baseUrl}/api/tags`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        const select = document.getElementById('model-select');
        select.innerHTML = '';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          opt.textContent = m.name;
          select.appendChild(opt);
        });
        alert('Connected successfully! Models loaded.');
      } catch (err) {
        alert('Could not reach Ollama backend: ' + err.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      const baseUrl = getBaseUrl();
      const model = document.getElementById('model-select').value;
      if (!text || !baseUrl) return;

      appendBubble('user', text);
      chatHistory.push({ role: 'user', content: text });
      input.value = '';

      const aiBubble = appendBubble('ai', '...');
      aiBubble.textContent = '';

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({
            model: model,
            messages: chatHistory,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullResponse = '';
        let buffer = ''; // Holds incomplete JSON fragments across network chunks

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          // Append new chunk to the buffer
          buffer += decoder.decode(value, { stream: true });
          
          // Split by newline
          const lines = buffer.split('\n');
          
          // Keep the last item in the buffer (it might be an incomplete line)
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);
              if (parsed.message && parsed.message.content) {
                fullResponse += parsed.message.content;
                aiBubble.textContent = fullResponse;
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
              }
            } catch (e) {
              console.warn('Skipped malformed line:', line);
            }
          }
        }

        // Parse any remaining data in the buffer when stream ends
        if (buffer.trim()) {
          try {
            const parsed = JSON.parse(buffer);
            if (parsed.message && parsed.message.content) {
              fullResponse += parsed.message.content;
              aiBubble.textContent = fullResponse;
            }
          } catch (e) {}
        }

        chatHistory.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        aiBubble.textContent = 'Error: ' + err.message;
      }
    }

    function appendBubble(role, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
