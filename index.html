<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local AI Studio</title>

  <!-- Marked (Markdown Parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js (Code Syntax Highlighting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- PDF.js (Client-side PDF Text Extraction) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --bg-main: #0c0c10;
      --bg-panel: #161622;
      --bg-header: rgba(22, 22, 34, 0.92);
      --bg-ai: #1b1b26;
      --bg-user: #007acc;
      --border: #282838;
      --text: #e6e6f0;
      --text-muted: #8c8ca0;
      --danger: #e54d42;
      --warning: #f39c12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Lock Screen Screen Modal --- */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(12, 12, 16, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 28px 22px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* --- Navigation Bar --- */
    header {
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .icon-btn {
      background: #20202e;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.95); }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 60%;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    #model-select {
      background: transparent;
      color: #4da6ff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      text-align: center;
    }
    #model-select option { background: var(--bg-panel); color: var(--text); }

    /* --- Drawers --- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 300px;
      max-width: 85vw;
      background: var(--bg-panel);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid var(--border);
    }
    .drawer.left { left: 0; transform: translateX(-100%); }
    .drawer.right { right: 0; transform: translateX(100%); border-right: none; border-left: 1px solid var(--border); }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-body {
      padding: 14px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* --- History Items --- */
    .new-chat-btn {
      background: var(--bg-user);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .chat-list { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
    }
    .chat-item.active { background: rgba(0, 122, 204, 0.18); border-color: var(--bg-user); }
    .chat-item-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      margin-right: 8px;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }
    .del-btn:hover { color: var(--danger); }

    .drawer-actions {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      background: #20202e;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    /* --- Form Controls --- */
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f0f16;
      color: var(--text);
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    input[type="range"] { width: 100%; accent-color: var(--bg-user); }

    .btn-primary {
      background: var(--bg-user);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: #20202e;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* --- Message Display --- */
    #chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }
    .message-wrapper.user { align-self: flex-end; align-items: flex-end; }
    .message-wrapper.ai { align-self: flex-start; align-items: flex-start; }

    .message {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 15px;
      word-break: break-word;
    }
    .user .message { background: var(--bg-user); color: #fff; border-bottom-right-radius: 4px; }
    .ai .message { background: var(--bg-ai); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    .ai .message p { margin-bottom: 8px; }
    .ai .message p:last-child { margin-bottom: 0; }
    .ai .message ul, .ai .message ol { margin-left: 20px; margin-bottom: 8px; }
    .ai .message table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
    .ai .message th, .ai .message td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .ai .message th { background: #252535; }

    /* Code Blocks */
    .code-container {
      position: relative;
      margin: 10px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #181824;
      border: 1px solid #303042;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      background: #20202e;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: #4da6ff;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    .code-container pre { margin: 0; padding: 10px; overflow-x: auto; font-size: 13px; }

    /* DeepSeek-R1 <think> Accordion */
    .think-accordion {
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid var(--warning);
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .think-accordion summary {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
      user-select: none;
    }
    .think-body {
      padding: 8px 12px;
      font-size: 13px;
      color: #a0a0b2;
      font-style: italic;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      white-space: pre-wrap;
    }

    .msg-stats {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: var(--text-muted);
      margin-top: 5px;
      padding: 0 4px;
    }
    .msg-attachment-img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }

    /* Attachment Tray */
    #attachment-tray {
      display: none;
      padding: 6px 14px;
      background: #12121a;
      border-top: 1px solid var(--border);
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .tray-chip {
      background: #20202e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip-del { color: var(--danger); cursor: pointer; font-weight: bold; }

    /* Bottom Input Bar */
    footer {
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #user-input {
      flex-grow: 1;
      border-radius: 20px;
      padding: 10px 16px;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.35;
      resize: none;
    }
    .footer-btn {
      background: #20202e;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .footer-btn.recording {
      background: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

    #send-btn { background: var(--bg-user); color: #fff; border: none; }
    #send-btn.stop-mode { background: var(--danger); }
  </style>
</head>
<body>

  <!-- Full-Screen Password Gate -->
  <div id="lock-screen">
    <div class="lock-modal">
      <div style="font-size: 32px; margin-bottom: 8px;">🔒</div>
      <h2 style="font-size: 18px; margin-bottom: 6px;">Local AI Studio</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Enter password to unlock interface</p>
      <input type="password" id="gate-pass-input" placeholder="Password..." onkeydown="if(event.key==='Enter') checkGatePassword()">
      <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="checkGatePassword()">Unlock</button>
      <div id="gate-error" style="color: var(--danger); font-size: 12px; margin-top: 10px; display: none;">Incorrect password</div>
    </div>
  </div>

  <!-- Drawers Overlay -->
  <div id="overlay" class="overlay" onclick="closeDrawers()"></div>

  <!-- Left Drawer: History & Exports -->
  <aside id="left-drawer" class="drawer left">
    <div class="drawer-header">
      <span>Saved Convos</span>
      <button class="icon-btn" style="width:30px;height:30px;font-size:13px;" onclick="closeDrawers()">✕</button>
    </div>
    <div class="drawer-body">
      <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
      <div id="chat-list" class="chat-list"></div>
      <div class="drawer-actions">
        <button class="action-btn" onclick="exportCurrentChat()">Export</button>
        <button class="action-btn" onclick="document.getElementById('import-file').click()">Import</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importChat(this)">
      </div>
    </div>
  </aside>

  <!-- Right Drawer: Engine & Security Settings -->
  <aside id="right-drawer" class="drawer right">
    <div class="drawer-header">
      <span>Settings</span>
      <button class="icon-btn" style="width:30px;height:30px;font-size:13px;" onclick="closeDrawers()">✕</button>
    </div>
    <div class="drawer-body">
      <div class="field-group">
        <label class="field-label">Cloudflare Tunnel URL</label>
        <input type="text" id="tunnel-url" placeholder="https://xxxx.trycloudflare.com" onchange="saveSettings()">
        <button class="btn-primary" onclick="fetchModels()">Connect & Refresh Models</button>
      </div>

      <div class="field-group">
        <label class="field-label">System Prompt</label>
        <textarea id="system-prompt" placeholder="Persona or rules..." onchange="saveSettings()"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">Context Length (Tokens)</label>
        <select id="ctx-size" onchange="saveSettings()">
          <option value="2048">2048</option>
          <option value="4096">4096 (DeepSeek-R1 Recommended)</option>
          <option value="8192">8192 (Long Memory)</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">
          <span>Temperature</span>
          <span id="temp-val">0.7</span>
        </label>
        <input type="range" id="temperature" min="0" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('temp-val').textContent = this.value; saveSettings()">
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0;">
        <span style="font-size:14px;">Pin Model to VRAM</span>
        <input type="checkbox" id="pin-vram" checked onchange="saveSettings()" style="width:18px;height:18px;accent-color:var(--bg-user);">
      </div>

      <hr style="border: none; border-top: 1px solid var(--border); margin: 6px 0;">

      <button class="btn-secondary" onclick="lockInterface()">🔒 Lock App Now</button>
    </div>
  </aside>

  <!-- Navigation Bar -->
  <header>
    <button class="icon-btn" onclick="toggleDrawer('left')" title="Chats">☰</button>
    <div class="header-center">
      <div id="current-chat-title" class="header-title">New Chat</div>
      <select id="model-select" onchange="saveSettings()">
        <option value="llama3.2">llama3.2</option>
      </select>
    </div>
    <button class="icon-btn" onclick="toggleDrawer('right')" title="Settings">⚙</button>
  </header>

  <!-- Chat Area -->
  <main id="chat-box"></main>

  <!-- Attachment Tray -->
  <div id="attachment-tray"></div>

  <!-- Bottom Input Bar -->
  <footer>
    <button class="footer-btn" onclick="document.getElementById('file-input').click()" title="Attach File/Image">📎</button>
    <input type="file" id="file-input" style="display:none;" multiple accept="image/*,.txt,.py,.js,.json,.pdf" onchange="handleFileSelection(this)">

    <button id="mic-btn" class="footer-btn" onclick="toggleVoiceInput()" title="Voice Dictation">🎤</button>

    <textarea id="user-input" rows="1" placeholder="Message local AI..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>

    <button id="send-btn" class="footer-btn" onclick="handleSendOrAbort()">➤</button>
  </footer>

  <script>
    // --- Configure Your Web Access Password Here ---
    const APP_GATE_PASSWORD = "JigGleFar7#@";

    // --- State Management ---
    let chats = JSON.parse(localStorage.getItem('ai_studio_chats') || '[]');
    let currentChatId = localStorage.getItem('ai_studio_active_chat') || null;
    let pendingAttachments = [];
    let abortController = null;
    let isGenerating = false;
    let recognition = null;
    let isRecording = false;

    // --- Markdown Configuration ---
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // --- Gate Security Logic ---
    function checkGateAuth() {
      if (sessionStorage.getItem('studio_unlocked') === 'true') {
        const screen = document.getElementById('lock-screen');
        if (screen) screen.style.display = 'none';
      }
    }

    function checkGatePassword() {
      const input = document.getElementById('gate-pass-input');
      const err = document.getElementById('gate-error');
      if (input.value === APP_GATE_PASSWORD) {
        sessionStorage.setItem('studio_unlocked', 'true');
        document.getElementById('lock-screen').style.display = 'none';
        err.style.display = 'none';
      } else {
        err.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }

    function lockInterface() {
      sessionStorage.removeItem('studio_unlocked');
      document.getElementById('lock-screen').style.display = 'flex';
      closeDrawers();
    }

    // --- Lifecycle Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      checkGateAuth();
      loadSettings();
      if (chats.length === 0) {
        createNewChat(false);
      } else {
        if (!chats.find(c => c.id === currentChatId)) currentChatId = chats[0].id;
        renderSidebar();
        renderCurrentChat();
      }
      initSpeechRecognition();
    });

    // --- Drawers ---
    function toggleDrawer(side) {
      closeDrawers();
      document.getElementById(`${side}-drawer`).classList.add('open');
      document.getElementById('overlay').classList.add('active');
    }
    function closeDrawers() {
      document.getElementById('left-drawer').classList.remove('open');
      document.getElementById('right-drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('active');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
    function handleEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
        e.preventDefault();
        handleSendOrAbort();
      }
    }

    // --- Settings Persistence ---
    function loadSettings() {
      document.getElementById('tunnel-url').value = localStorage.getItem('backend_url') || '';
      document.getElementById('system-prompt').value = localStorage.getItem('cfg_system_prompt') || '';
      document.getElementById('ctx-size').value = localStorage.getItem('cfg_ctx_size') || '4096';
      const temp = localStorage.getItem('cfg_temperature') || '0.7';
      document.getElementById('temperature').value = temp;
      document.getElementById('temp-val').textContent = temp;
      document.getElementById('pin-vram').checked = localStorage.getItem('cfg_pin_vram') !== 'false';

      const cached = JSON.parse(localStorage.getItem('cached_models') || '[]');
      const saved = localStorage.getItem('cfg_selected_model');
      if (cached.length > 0) populateModelDropdown(cached, saved);
    }

    function saveSettings() {
      let url = document.getElementById('tunnel-url').value.trim();
      if (url.endsWith('/')) url = url.slice(0, -1);
      localStorage.setItem('backend_url', url);
      localStorage.setItem('cfg_system_prompt', document.getElementById('system-prompt').value);
      localStorage.setItem('cfg_ctx_size', document.getElementById('ctx-size').value);
      localStorage.setItem('cfg_temperature', document.getElementById('temperature').value);
      localStorage.setItem('cfg_pin_vram', document.getElementById('pin-vram').checked);
      localStorage.setItem('cfg_selected_model', document.getElementById('model-select').value);
    }
    function getBaseUrl() { saveSettings(); return localStorage.getItem('backend_url') || ''; }

    // --- Chat Session Persistence ---
    function saveChatsToStorage() {
      localStorage.setItem('ai_studio_chats', JSON.stringify(chats));
      localStorage.setItem('ai_studio_active_chat', currentChatId);
      renderSidebar();
    }
    function getCurrentChat() { return chats.find(c => c.id === currentChatId); }

    function createNewChat(close = true) {
      if (isGenerating) abortGeneration();
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Chat',
        updatedAt: Date.now(),
        messages: []
      };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveChatsToStorage();
      renderCurrentChat();
      if (close) closeDrawers();
    }

    function switchChat(id) {
      if (isGenerating) abortGeneration();
      currentChatId = id;
      saveChatsToStorage();
      renderCurrentChat();
      closeDrawers();
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      if (isGenerating) abortGeneration();
      chats = chats.filter(c => c.id !== id);
      if (chats.length === 0) createNewChat(false);
      else if (currentChatId === id) currentChatId = chats[0].id;
      saveChatsToStorage();
      renderCurrentChat();
    }

    function renderSidebar() {
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      chats.forEach(chat => {
        const row = document.createElement('div');
        row.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        row.onclick = () => switchChat(chat.id);

        const title = document.createElement('div');
        title.className = 'chat-item-title';
        title.textContent = chat.title;

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '✕';
        del.onclick = (e) => deleteChat(chat.id, e);

        row.appendChild(title);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    // --- Markdown & DeepSeek <think> Parser ---
    function formatAIMessage(rawText) {
      let content = rawText;
      let thinkHtml = '';

      if (content.includes('<think>')) {
        if (content.includes('</think>')) {
          const parts = content.split('</think>');
          const thinkText = parts[0].replace('<think>', '').trim();
          content = parts.slice(1).join('</think>').trim();
          thinkHtml = `
            <details class="think-accordion">
              <summary>Thinking Process (Tap to Expand)</summary>
              <div class="think-body">${escapeHtml(thinkText)}</div>
            </details>
          `;
        } else {
          const thinkText = content.replace('<think>', '').trim();
          return `
            <details class="think-accordion" open>
              <summary>Thinking...</summary>
              <div class="think-body">${escapeHtml(thinkText)}</div>
            </details>
          `;
        }
      }

      return thinkHtml + marked.parse(content || '');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function postProcessCodeBlocks(container) {
      container.querySelectorAll('pre code').forEach((block) => {
        if (block.parentElement.parentElement.classList.contains('code-container')) return;

        const pre = block.parentElement;
        const codeWrapper = document.createElement('div');
        codeWrapper.className = 'code-container';

        const lang = block.className.replace('language-', '') || 'code';
        const header = document.createElement('div');
        header.className = 'code-header';
        header.innerHTML = `<span>${lang}</span><button class="copy-btn" onclick="copySnippet(this)">Copy</button>`;

        pre.parentNode.insertBefore(codeWrapper, pre);
        codeWrapper.appendChild(header);
        codeWrapper.appendChild(pre);
      });
    }

    function copySnippet(btn) {
      const code = btn.closest('.code-container').querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }

    // --- Message UI Rendering ---
    function renderCurrentChat() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      const chat = getCurrentChat();
      if (!chat) return;

      document.getElementById('current-chat-title').textContent = chat.title;

      if (chat.messages.length === 0) {
        box.innerHTML = '<div style="margin:auto;text-align:center;color:var(--text-muted);font-size:14px;max-width:260px;line-height:1.5;">Tap ⚙ to connect your Cloudflare URL. Model, voice, and vision are ready.</div>';
        return;
      }

      chat.messages.forEach(msg => {
        appendBubbleUI(msg.role, msg.content, msg.stats || '', msg.images);
      });
    }

    function appendBubbleUI(role, rawContent, statsText = '', images = null) {
      const box = document.getElementById('chat-box');
      if (box.querySelector('div[style*="margin:auto"]')) box.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${role === 'user' ? 'user' : 'ai'}`;

      const bubble = document.createElement('div');
      bubble.className = 'message';

      if (role === 'user') {
        if (images && images.length > 0) {
          images.forEach(b64 => {
            const img = document.createElement('img');
            img.src = `data:image/jpeg;base64,${b64}`;
            img.className = 'msg-attachment-img';
            bubble.appendChild(img);
          });
        }
        const textSpan = document.createElement('div');
        textSpan.style.whiteSpace = 'pre-wrap';
        textSpan.textContent = rawContent;
        bubble.appendChild(textSpan);
      } else {
        bubble.innerHTML = formatAIMessage(rawContent);
        postProcessCodeBlocks(bubble);
      }
      wrapper.appendChild(bubble);

      let statsEl = null;
      if (role !== 'user') {
        statsEl = document.createElement('div');
        statsEl.className = 'msg-stats';
        statsEl.textContent = statsText;
        wrapper.appendChild(statsEl);
      }

      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return { bubble, statsEl };
    }

    // --- Attachments (Vision & Document Extraction) ---
    async function handleFileSelection(input) {
      const files = Array.from(input.files);
      if (!files.length) return;

      for (const file of files) {
        const ext = file.name.split('.').pop().toLowerCase();

        if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
          const b64 = await readFileAsBase64(file);
          pendingAttachments.push({ name: file.name, isImage: true, content: b64 });
        } else if (ext === 'pdf') {
          const text = await extractTextFromPDF(file);
          pendingAttachments.push({ name: file.name, isImage: false, content: text });
        } else {
          const text = await file.text();
          pendingAttachments.push({ name: file.name, isImage: false, content: text });
        }
      }
      input.value = '';
      renderAttachmentTray();
    }

    function readFileAsBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });
    }

    async function extractTextFromPDF(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(' ') + '\n';
        }
        return fullText;
      } catch (err) {
        return `[PDF read error: ${err.message}]`;
      }
    }

    function renderAttachmentTray() {
      const tray = document.getElementById('attachment-tray');
      if (pendingAttachments.length === 0) {
        tray.style.display = 'none';
        tray.innerHTML = '';
        return;
      }
      tray.style.display = 'flex';
      tray.innerHTML = '';
      pendingAttachments.forEach((att, idx) => {
        const chip = document.createElement('div');
        chip.className = 'tray-chip';
        chip.innerHTML = `<span>${att.isImage ? '🖼️' : '📄'} ${escapeHtml(att.name)}</span><span class="chip-del" onclick="removeAttachment(${idx})">✕</span>`;
        tray.appendChild(chip);
      });
    }

    function removeAttachment(idx) {
      pendingAttachments.splice(idx, 1);
      renderAttachmentTray();
    }

    // --- Voice Dictation ---
    function initSpeechRecognition() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        document.getElementById('mic-btn').style.display = 'none';
        return;
      }
      recognition = new Speech();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('mic-btn').classList.add('recording');
      };
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        const input = document.getElementById('user-input');
        input.value = (input.value ? input.value + ' ' : '') + transcript;
        autoResize(input);
      };
      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function toggleVoiceInput() {
      if (!recognition) return alert('Speech recognition not supported on this browser.');
      if (isRecording) recognition.stop();
      else recognition.start();
    }
    function stopRecording() {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
    }

    // --- Execution & Streaming Flow ---
    function handleSendOrAbort() {
      if (isGenerating) abortGeneration();
      else sendMessage();
    }

    function abortGeneration() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      setGeneratingUI(false);
    }

    function setGeneratingUI(generating) {
      isGenerating = generating;
      const btn = document.getElementById('send-btn');
      if (generating) {
        btn.textContent = '⏹';
        btn.classList.add('stop-mode');
      } else {
        btn.textContent = '➤';
        btn.classList.remove('stop-mode');
      }
    }

    function populateModelDropdown(names, selected) {
      const sel = document.getElementById('model-select');
      sel.innerHTML = '';
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        sel.appendChild(opt);
      });
      if (selected && names.includes(selected)) sel.value = selected;
    }

    async function fetchModels() {
      const baseUrl = getBaseUrl();
      if (!baseUrl) return alert('Enter tunnel URL first.');
      try {
        const res = await fetch(`${baseUrl}/api/tags`);
        const data = await res.json();
        const names = data.models.map(m => m.name);
        localStorage.setItem('cached_models', JSON.stringify(names));
        populateModelDropdown(names, localStorage.getItem('cfg_selected_model'));
        saveSettings();
        alert(`Connected! Loaded ${names.length} models.`);
        closeDrawers();
      } catch (err) {
        alert('Could not reach Ollama: ' + err.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      const baseUrl = getBaseUrl();
      const model = document.getElementById('model-select').value;

      if (!text && pendingAttachments.length === 0) return;
      if (!baseUrl) {
        toggleDrawer('right');
        return alert('Please enter your backend tunnel URL.');
      }

      const chat = getCurrentChat();
      if (!chat) return;

      const imagesPayload = [];
      let docContext = '';

      pendingAttachments.forEach(att => {
        if (att.isImage) imagesPayload.push(att.content);
        else docContext += `\n[File Attachment: ${att.name}]\n${att.content}\n`;
      });

      const fullUserPrompt = docContext ? `${docContext}\nUser: ${text}` : text;

      if (chat.messages.length === 0) {
        chat.title = (text || pendingAttachments[0]?.name || 'Chat').slice(0, 26);
        document.getElementById('current-chat-title').textContent = chat.title;
      }

      const userMsgObj = {
        role: 'user',
        content: text,
        images: imagesPayload.length ? imagesPayload : undefined
      };
      chat.messages.push(userMsgObj);
      chat.updatedAt = Date.now();
      saveChatsToStorage();

      appendBubbleUI('user', text, '', imagesPayload);

      input.value = '';
      input.style.height = 'auto';
      pendingAttachments = [];
      renderAttachmentTray();

      const { bubble: aiBubble, statsEl } = appendBubbleUI('assistant', '...', 'Generating...');
      aiBubble.textContent = '';
      setGeneratingUI(true);

      const systemPrompt = document.getElementById('system-prompt').value.trim();
      const payloadMessages = [];
      if (systemPrompt) payloadMessages.push({ role: 'system', content: systemPrompt });

      chat.messages.forEach(m => {
        const item = { role: m.role, content: m.content };
        if (m.images) item.images = m.images;
        payloadMessages.push(item);
      });

      if (docContext) {
        payloadMessages[payloadMessages.length - 1].content = fullUserPrompt;
      }

      const ctxSize = parseInt(document.getElementById('ctx-size').value) || 4096;
      const temp = parseFloat(document.getElementById('temperature').value) || 0.7;
      const pinVram = document.getElementById('pin-vram').checked;

      abortController = new AbortController();
      const startTime = performance.now();
      let tokenCount = 0;
      let fullResponse = '';
      let buffer = '';
      let finalStats = '';

      try {
        // Use text/plain to bypass strict mobile browser CORS preflights
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          signal: abortController.signal,
          body: JSON.stringify({
            model: model,
            messages: payloadMessages,
            stream: true,
            options: { num_ctx: ctxSize, temperature: temp },
            keep_alive: pinVram ? -1 : 300
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Preserve split fragments

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);
              if (parsed.message && parsed.message.content) {
                fullResponse += parsed.message.content;
                tokenCount++;

                aiBubble.innerHTML = formatAIMessage(fullResponse);
                postProcessCodeBlocks(aiBubble);

                const elapsedSec = (performance.now() - startTime) / 1000;
                if (elapsedSec > 0.2) {
                  statsEl.textContent = `${(tokenCount / elapsedSec).toFixed(1)} t/s`;
                }
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
              }

              if (parsed.done && parsed.eval_count && parsed.eval_duration) {
                const exactTps = parsed.eval_count / (parsed.eval_duration / 1e9);
                finalStats = `${exactTps.toFixed(1)} t/s • ${parsed.eval_count} tokens`;
                statsEl.textContent = finalStats;
              }
            } catch (e) {}
          }
        }

        chat.messages.push({
          role: 'assistant',
          content: fullResponse,
          stats: finalStats || statsEl.textContent
        });
        saveChatsToStorage();

      } catch (err) {
        if (err.name === 'AbortError') {
          statsEl.textContent = 'Generation stopped.';
          if (fullResponse) {
            chat.messages.push({ role: 'assistant', content: fullResponse, stats: 'Stopped' });
            saveChatsToStorage();
          }
        } else {
          aiBubble.textContent = 'Error: ' + err.message;
          statsEl.textContent = 'Failed';
        }
      } finally {
        setGeneratingUI(false);
        abortController = null;
      }
    }

    // --- Backup & Restore ---
    function exportCurrentChat() {
      const chat = getCurrentChat();
      if (!chat) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chat, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
      a.click();
    }

    function importChat(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.messages && Array.isArray(imported.messages)) {
            imported.id = 'chat_' + Date.now();
            chats.unshift(imported);
            currentChatId = imported.id;
            saveChatsToStorage();
            renderCurrentChat();
            closeDrawers();
          } else {
            alert('Invalid chat format.');
          }
        } catch (err) {
          alert('Failed to parse JSON.');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }
  </script>
